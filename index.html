<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Клеточный Автомат</title>
<style>
  * { box-sizing: border-box; }
  body { 
    margin: 0; font-family: system-ui, -apple-system, sans-serif; 
    background: #0f172a; color: #e2e8f0; 
    height: 100vh; overflow: hidden; /* Запрещаем скролл всей страницы */
    display: flex; flex-direction: column;
  }
  
  /* Шапка с параметрами */
  #header {
    background: #1e293b; padding: 8px 12px; display: flex; 
    justify-content: space-between; align-items: center; 
    font-size: 13px; border-bottom: 1px solid #334155; flex-shrink: 0;
  }
  #header b { color: #38bdf8; }
  
  /* Контейнер для поля (занимает всё оставшееся место) */
  #canvas-container {
    flex: 1; position: relative; background: #0f172a; 
    display: flex; justify-content: center; align-items: center;
    overflow: hidden;
  }
  canvas { 
    display: block; cursor: crosshair; touch-action: none; /* Отключаем жесты браузера на канвасе */
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
  }

  /* Панель управления (выдвижная) */
  #controls {
    background: #1e293b; border-top: 1px solid #334155;
    transition: max-height 0.3s ease; max-height: 60px; overflow: hidden;
    flex-shrink: 0;
  }
  #controls.expanded { max-height: 500px; }
  
  .control-header {
    padding: 12px; display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; font-weight: bold; color: #38bdf8;
  }
  .control-content { padding: 0 12px 12px; }
  
  .rule-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .rule-label { font-weight: bold; width: 20px; color: #94a3b8; font-size: 14px; }
  .btn-rule {
    flex: 1; padding: 8px 0; background: #334155; border: none; border-radius: 6px;
    color: #cbd5e1; font-weight: bold; font-size: 13px; cursor: pointer; transition: all 0.1s;
  }
  .btn-rule.active { background: #2563eb; color: white; box-shadow: 0 0 8px rgba(37, 99, 235, 0.5); }

  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  button.ctrl {
    flex: 1; background: #334155; color: white; border: 0; padding: 12px;
    border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; transition: background 0.2s;
  }
  button.ctrl.primary { background: #2563eb; }
  button.ctrl.danger { background: #dc2626; }
  
  .preset-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .preset-btn {
    background: #0f172a; border: 1px solid #334155; color: #e2e8f0; padding: 6px 10px;
    border-radius: 6px; cursor: pointer; font-size: 11px; transition: all 0.2s;
  }
  .preset-btn:hover { background: #1e293b; border-color: #38bdf8; }

  .slider-row { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  input[type=range] { flex: 1; accent-color: #2563eb; height: 30px; }
</style>
</head>
<body>

<div id="header">
  <div>Поколение: <b id="genCount">0</b></div>
  <div>Живых: <b id="cellCount">0</b></div>
</div>

<div id="canvas-container">
  <canvas id="world"></canvas>
</div>

<div id="controls">
  <div class="control-header" id="toggleControls">
    <span>⚙ Настройки и управление</span>
    <span id="toggleIcon">▼</span>
  </div>
  <div class="control-content">
    <div class="rule-row">
      <span class="rule-label">B:</span>
      <button class="btn-rule" data-type="B" data-val="0">0</button>
      <button class="btn-rule" data-type="B" data-val="1">1</button>
      <button class="btn-rule" data-type="B" data-val="2">2</button>
      <button class="btn-rule active" data-type="B" data-val="3">3</button>
      <button class="btn-rule" data-type="B" data-val="4">4</button>
      <button class="btn-rule" data-type="B" data-val="5">5</button>
      <button class="btn-rule" data-type="B" data-val="6">6</button>
      <button class="btn-rule" data-type="B" data-val="7">7</button>
      <button class="btn-rule" data-type="B" data-val="8">8</button>
    </div>
    <div class="rule-row">
      <span class="rule-label">S:</span>
      <button class="btn-rule" data-type="S" data-val="0">0</button>
      <button class="btn-rule" data-type="S" data-val="1">1</button>
      <button class="btn-rule active" data-type="S" data-val="2">2</button>
      <button class="btn-rule active" data-type="S" data-val="3">3</button>
      <button class="btn-rule" data-type="S" data-val="4">4</button>
      <button class="btn-rule" data-type="S" data-val="5">5</button>
      <button class="btn-rule" data-type="S" data-val="6">6</button>
      <button class="btn-rule" data-type="S" data-val="7">7</button>
      <button class="btn-rule" data-type="S" data-val="8">8</button>
    </div>

    <div class="btn-group">
      <button class="ctrl primary" id="playBtn">▶ Старт</button>
      <button class="ctrl" id="stepBtn">Шаг +1</button>
    </div>
    <div class="btn-group">
      <button class="ctrl" id="randomBtn">🎲 Случайно</button>
      <button class="ctrl danger" id="clearBtn">🗑 Очистить</button>
    </div>

    <div class="slider-row">
      <span style="font-size: 13px; color: #94a3b8;">Скорость:</span>
      <input type="range" id="speedSlider" min="1" max="60" value="15">
      <span id="speedVal" style="font-size: 13px; font-weight: bold; color: #38bdf8; width: 25px; text-align: right;">15</span>
    </div>

    <div class="preset-row">
      <button class="preset-btn" data-b="3" data-s="23">Оригинал</button>
      <button class="preset-btn" data-b="36" data-s="23">Высокая жизнь</button>
      <button class="preset-btn" data-b="1" data-s="1">Фракталы</button>
      <button class="preset-btn" data-b="2" data-s="">Семена</button>
      <button class="preset-btn" data-b="35678" data-s="5678">Хаос</button>
    </div>
  </div>
</div>

<script>
// ============================================================
//  АДАПТИВНЫЙ РАЗМЕР И СЕТКА
// ============================================================
const canvas = document.getElementById('world');
const ctx = canvas.getContext('2d');
const container = document.getElementById('canvas-container');

let CELL_SIZE = 6; 
let COLS, ROWS;
let grid, nextGrid;

// Функция пересоздания сетки при изменении размера экрана
function resizeCanvas() {
  const rect = container.getBoundingClientRect();
  
  // Выбираем размер клетки так, чтобы на экране было около 100 колонок (для телефона)
  // Но не меньше 4 и не больше 10 пикселей
  CELL_SIZE = Math.max(4, Math.min(10, Math.floor(rect.width / 90))); 
  
  COLS = Math.floor(rect.width / CELL_SIZE);
  ROWS = Math.floor(rect.height / CELL_SIZE);
  
  canvas.width = COLS * CELL_SIZE;
  canvas.height = ROWS * CELL_SIZE;
  
  // Создаем новые массивы
  grid = new Uint8Array(COLS * ROWS);
  nextGrid = new Uint8Array(COLS * ROWS);
  
  draw();
}

window.addEventListener('resize', resizeCanvas);

// ============================================================
//  СОСТОЯНИЕ И ПРАВИЛА
// ============================================================
let rules = { B: [3], S: [2, 3] };
let isPlaying = false;
let generation = 0;
let speed = 15; 
let lastUpdate = 0;

// ============================================================
//  ОТРИСОВКА
// ============================================================
function draw() {
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#38bdf8';
  let aliveCount = 0;

  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (grid[y * COLS + x] === 1) {
        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE - 1, CELL_SIZE - 1);
        aliveCount++;
      }
    }
  }

  document.getElementById('genCount').textContent = generation;
  document.getElementById('cellCount').textContent = aliveCount;
}

// ============================================================
//  ЛОГИКА
// ============================================================
function countNeighbors(x, y) {
  let count = 0;
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      if (dx === 0 && dy === 0) continue;
      // Тороидальное поле (края заворачиваются)
      const nx = (x + dx + COLS) % COLS;
      const ny = (y + dy + ROWS) % ROWS;
      count += grid[ny * COLS + nx];
    }
  }
  return count;
}

function step() {
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const idx = y * COLS + x;
      const n = countNeighbors(x, y);
      
      if (grid[idx] === 1) {
        nextGrid[idx] = rules.S.includes(n) ? 1 : 0;
      } else {
        nextGrid[idx] = rules.B.includes(n) ? 1 : 0;
      }
    }
  }

  const temp = grid;
  grid = nextGrid;
  nextGrid = temp;

  generation++;
  draw();
}

// ============================================================
//  ИНТЕРФЕЙС (Кнопки и настройки)
// ============================================================
document.getElementById('toggleControls').addEventListener('click', () => {
  const c = document.getElementById('controls');
  c.classList.toggle('expanded');
  document.getElementById('toggleIcon').textContent = c.classList.contains('expanded') ? '▲' : '▼';
});

document.querySelectorAll('.btn-rule').forEach(btn => {
  btn.addEventListener('click', () => {
    const type = btn.dataset.type; // 'B' или 'S'
    const val = parseInt(btn.dataset.val);
    const arr = rules[type];
    const index = arr.indexOf(val);

    if (index > -1) {
      arr.splice(index, 1);
      btn.classList.remove('active');
    } else {
      arr.push(val);
      btn.classList.add('active');
    }
    arr.sort((a, b) => a - b);
  });
});

document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    rules.B = btn.dataset.b ? btn.dataset.b.split('').map(Number) : [];
    rules.S = btn.dataset.s ? btn.dataset.s.split('').map(Number) : [];

    document.querySelectorAll('.btn-rule').forEach(ruleBtn => {
      const type = ruleBtn.dataset.type;
      const val = parseInt(ruleBtn.dataset.val);
      ruleBtn.classList.toggle('active', rules[type].includes(val));
    });
  });
});

document.getElementById('playBtn').addEventListener('click', (e) => {
  isPlaying = !isPlaying;
  e.target.textContent = isPlaying ? '⏸ Пауза' : '▶ Старт';
  e.target.classList.toggle('primary', !isPlaying);
  if (isPlaying) requestAnimationFrame(loop);
});

document.getElementById('stepBtn').addEventListener('click', () => {
  if (!isPlaying) step();
});

document.getElementById('randomBtn').addEventListener('click', () => {
  for (let i = 0; i < grid.length; i++) grid[i] = Math.random() < 0.2 ? 1 : 0;
  generation = 0;
  draw();
});

document.getElementById('clearBtn').addEventListener('click', () => {
  grid.fill(0);
  generation = 0;
  draw();
});

document.getElementById('speedSlider').addEventListener('input', (e) => {
  speed = parseInt(e.target.value);
  document.getElementById('speedVal').textContent = speed;
});

// ============================================================
//  РИСОВАНИЕ (Мышь и Тач)
// ============================================================
let isDrawing = false;
let drawMode = 1; // 1 = рисовать, 0 = стирать

// Получение координат из события (мышь или тач)
function getGridCoords(e) {
  const rect = canvas.getBoundingClientRect();
  // Поддержка как мыши, так и тач-событий
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  
  const x = Math.floor((clientX - rect.left) / CELL_SIZE);
  const y = Math.floor((clientY - rect.top) / CELL_SIZE);
  return { x, y };
}

function handlePointerDown(e) {
  e.preventDefault(); // Чтобы страница не скроллилась при рисовании пальцем
  isDrawing = true;
  const { x, y } = getGridCoords(e);
  
  if (x >= 0 && x < COLS && y >= 0 && y < ROWS) {
    const idx = y * COLS + x;
    // Если попали по живой — стираем, по мертвой — рисуем
    drawMode = grid[idx] === 1 ? 0 : 1; 
    grid[idx] = drawMode;
    draw();
  }
}

function handlePointerMove(e) {
  if (!isDrawing) return;
  e.preventDefault();
  const { x, y } = getGridCoords(e);
  
  if (x >= 0 && x < COLS && y >= 0 && y < ROWS) {
    // Рисуем линию между предыдущей точкой и текущей, чтобы не было разрывов при быстром свайпе
    grid[y * COLS + x] = drawMode;
    draw();
  }
}

function handlePointerUp() {
  isDrawing = false;
}

// Вешаем события на Canvas (и мышь, и тач)
canvas.addEventListener('mousedown', handlePointerDown);
canvas.addEventListener('mousemove', handlePointerMove);
window.addEventListener('mouseup', handlePointerUp);

canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
canvas.addEventListener('touchmove', handlePointerMove, { passive: false });
window.addEventListener('touchend', handlePointerUp);

// ============================================================
//  ЦИКЛ АНИМАЦИИ
// ============================================================
function loop(timestamp) {
  if (!isPlaying) return;

  if (timestamp - lastUpdate > 1000 / speed) {
    step();
    lastUpdate = timestamp;
  }
  requestAnimationFrame(loop);
}

// Инициализация при загрузке
resizeCanvas();
</script>
</body>
</html>
